<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · KeyShin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111114">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Noto+Serif+JP:wght@700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen bg-base font-sans text-fg antialiased">
  <main class="grid min-h-screen lg:grid-cols-[1.1fr_1fr]">

    <!-- Brand panel: the seal stamping a key. Hidden on small screens. -->
    <section class="relative hidden overflow-hidden border-r border-line bg-panel lg:flex lg:flex-col lg:justify-between lg:p-14" aria-hidden="true">
      <div class="flex items-center gap-3">
        <span class="seal seal-sm">鍵</span>
        <span class="text-lg font-semibold tracking-tight">KeyShin</span>
      </div>

      <div class="key-card">
        <p class="text-sm text-muted">Kishin Plugin · Pro</p>
        <p class="mt-3 font-mono text-2xl tracking-wider xl:text-3xl">KSHN-8F3A-Q2LM-7XWD</p>
        <p class="mt-6 pr-16 text-sm text-muted">Issued to a customer, checked by your plugin, revoked by you.</p>
        <span class="seal seal-stamp">鍵</span>
      </div>

      <p class="max-w-sm text-sm leading-relaxed text-muted">License keys for every Kishin project, issued and managed in one place.</p>
    </section>

    <!-- Sign-in form -->
    <section class="flex items-center justify-center px-6 py-16 sm:px-10">
      <div class="w-full max-w-sm">
        <div class="mb-10 flex items-center gap-3 lg:hidden">
          <span class="seal seal-sm">鍵</span>
          <span class="text-lg font-semibold tracking-tight">KeyShin</span>
        </div>

        <h1 class="text-3xl font-semibold tracking-tight">Sign in</h1>
        <p class="mt-2 text-muted">Admin access to licenses and products.</p>

        <form id="login-form" class="mt-10 space-y-5" novalidate>
          <div>
            <label for="username" class="mb-1.5 block text-sm font-medium">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus
                   class="field" spellcheck="false" autocapitalize="off">
          </div>
          <div>
            <label for="password" class="mb-1.5 block text-sm font-medium">Password</label>
            <div class="relative">
              <input id="password" name="password" type="password" autocomplete="current-password" required
                     class="field pr-16">
              <button type="button" id="toggle-password"
                      class="absolute inset-y-0 right-0 px-3 text-sm font-medium text-muted hover:text-fg focus-visible:text-fg"
                      aria-controls="password" aria-pressed="false">Show</button>
            </div>
          </div>

          <p id="login-error" class="hidden rounded-md border-l-4 border-accent bg-accent-soft px-3 py-2.5 text-sm" role="alert"></p>

          <button id="login-submit" type="submit" class="btn-primary w-full">Sign in</button>
        </form>
      </div>
    </section>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
